<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我们的周年纪念</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe6e9 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        /* 波浪装饰 */
        .wave {
            position: absolute;
            height: 150px;
            width: 100%;
            background: #ff7eb3;
            opacity: 0.3;
        }

        .wave::before,
        .wave::after {
            content: '';
            position: absolute;
            width: 300vw;
            height: 300vw;
            top: -65vw;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 44%;
        }

        .wave::before {
            background: rgba(255, 255, 255, 0.8);
            animation: wave 15s linear infinite;
        }

        .wave::after {
            background: rgba(255, 255, 255, 0.5);
            animation: wave 18s linear infinite;
            opacity: 0.6;
        }

        /* 图片容器 */
        .photo-container {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            margin-top: 100px;
        }

        .photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid #ff7eb3;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(255, 126, 179, 0.3);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 文字信息 */
        .info {
            text-align: center;
            margin: 40px 0;
            color: #ff4d94;
        }

        .info h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* 底部区域 */
        .footer {
            position: relative;
            padding: 30px;
            text-align: center;
        }

        .timer {
            font-size: 1.8em;
            color: #ff4d94;
            margin-bottom: 20px;
        }

        .message-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #ff7eb3;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2em;
            transition: transform 0.3s;
        }

        .message-btn:hover {
            transform: scale(1.1);
        }

        /* 泡泡动画 */
        .bubbles {
            position: fixed;
            width: 100%;
            height: 100vh;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: bubble 8s infinite;
        }

        @keyframes wave {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        @keyframes bubble {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            20% { opacity: 1; }
            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="wave"></div>
    
    <div class="photo-container">
        <!-- 替换以下图片路径 -->
        <div class="photo">
            <img src="your-left-image.jpg" alt="我们的照片">
        </div>
        <div class="photo">
            <img src="your-right-image.jpg" alt="我们的照片">
        </div>
    </div>

    <div class="info">
        <!-- 修改以下姓名信息 -->
        <h1>张三 ❤ 李四</h1>
        <p>2023年12月5日 - 永远</p>
    </div>

    <div class="footer">
        <div class="timer" id="timer">我们已经相爱 <span id="days">0</span> 天</div>
        <a href="https://docs.qq.com/doc/DUFdwbXh1YnpnV2xS#" class="message-btn" target="_blank">留言板</a>
    </div>

    <div class="bubbles"></div>

    <script>
        // 天数计算
        const startDate = new Date('2024-12-05');
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('days').textContent = days;
        }
        setInterval(updateTimer, 1000);

        // 创建泡泡
        function createBubble() {
            const bubbles = document.querySelector('.bubbles');
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const size = Math.random() * 30 + 20;
            const left = Math.random() * 100;
            const duration = Math.random() * 3 + 5;
            
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${left}%`;
            bubble.style.animationDuration = `${duration}s`;
            
            bubbles.appendChild(bubble);
            
            setTimeout(() => bubble.remove(), duration * 1000);
        }

        // 每隔300ms创建一个泡泡
        setInterval(createBubble, 300);
    </script>
</body>
</html>
